<!DOCTYPE html>
<html>
  <head>
    <title>Integrações</title>
    <meta charset="UTF-8">
    <meta name="description" content="Integrações">
    <th:block th:replace="fragments/CssFragment :: css"></th:block>
    <th:block th:replace="layout/fragments/Menu :: menu"></th:block>
  </head>
  <body>
    <section class="py-5 text-center container">
      <div class="row py-lg-5">
        <div class="col-lg-6 col-md-8 mx-auto">
          <h1 class="fw-light">Integrador Storedrinks</h1>
          <p class="lead text-body-secondary">Seja bem vindo ao Integrador Storedrinks, selecione a plataforma na qual gostaria de fazer a integração.</p>
        </div>
      </div>
    </section>
    <main class="container mb-4 py-5 bg-light d-flex justify-content-center">
      <div class="row g-3 ">
        <div class="col-sm-12 col-md-4 col-lg-4 col-xl-4 d-flex justify-content-center">
          <div class="card" style="width: 150px;">
            <div class="d-flex justify-content-center mt-2">
              <img draggable="false" th:src="@{/imagens/mercado-livre-logo.png}" alt="Logo mercado livre">
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-center mt-2">
                <a id="btnMercadoLivre" class="btn btn-warning text-primary" style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem; background-color: #fae634">Mercado Livre</a>
              </div>
            </div>
          </div>
        </div>
        <div class="col-sm-12 col-md-4 col-lg-4 col-xl-4 d-flex justify-content-center">
          <div class="card" style="width: 150px;">
            <div class="d-flex justify-content-center mt-2">
              <img th:src="@{/imagens/shopee-logo.png}"  alt="Logo shopee">
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-center mt-2">
                <a href="#" class="btn btn-danger " style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">Shopee</a>
              </div>
            </div>
          </div>
        </div>
        <div class="col-sm-12 col-md-4 col-lg-4 col-xl-4 d-flex justify-content-center">
          <div class="card" style="width: 150px;">
              <div class="d-flex justify-content-center mt-2">
                  <img th:src="@{/imagens/magalu-logo.png}" alt="Logo mercado livre" >
              </div>
            <div class="card-body">
              <div class="d-flex justify-content-center mt-2">
                <a href="#" class="btn btn-primary " style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">Magazine Luiza</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <th:block th:replace="fragments/JsFragment :: script"></th:block>
    <script th:src="@{/alldrink-js/integracoes/Integracoes.js}" type="text/javascript"></script>
  </body>
</html>
