<!DOCTYPE html>
<html>
  <head>
    <title>Integrações</title>
    <meta charset="UTF-8">
    <meta name="description" content="Integrações">
    <th:block th:replace="fragments/CssFragment :: css"></th:block>
    <th:block th:replace="layout/fragments/Menu :: menu"></th:block>
  </head>
  <body>
    <section class="py-5 text-center container">
      <div class="row py-lg-5">
        <div class="col-lg-6 col-md-8 mx-auto">
          <h1 class="fw-light">Integrador Storedrinks</h1>
          <p class="lead text-body-secondary">Seja bem vindo ao Integrador Storedrinks, selecione a plataforma na qual gostaria de fazer a integração.</p>
        </div>
      </div>
    </section>
    <main class="container mb-4 py-5 bg-body-tertiary d-flex justify-content-center">
      <div class="row g-3">
        <div class="col-sm-12 col-md-6 col-lg-4 col-xl-4">
          <div class="card" style="width: 300px">
            <img draggable="false" th:src="@{/imagens/Store1.png}" class="rounded-circle p-1" alt="Logo mercado livre">
            <div class="card-body">
              <h5 class="card-title text-warning">Mercado Livre</h5>
              <p class="card-text">Integração com Mercado Livre</p>
              <a href="#" class="btn btn-warning " style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">Mercado Livre</a>
            </div>
          </div>
        </div>
        <div class="col-sm-12 col-md-6 col-lg-4 col-xl-4">
          <div class="card" style="width: 300px">
            <img th:src="@{/imagens/Store1.png}" class="rounded-circle p-1" alt="Logo mercado livre">
            <div class="card-body">
              <h5 class="card-title text-danger">Shopee</h5>
              <p class="card-text">Integração com Shopee</p>
              <a href="#" class="btn btn-danger " style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">Shopee</a>
            </div>
          </div>
        </div>
        <div class="col-sm-12 col-md-6 col-lg-4 col-xl-4">
          <div class="card" style="width: 300px">
            <img th:src="@{/imagens/Store1.png}" class="rounded-circle p-1" alt="Logo mercado livre" >
            <div class="card-body">
              <h5 class="card-title text-primary">Magazine Luiza</h5>
              <p class="card-text">Integração com Magazine Luiza</p>
              <a href="#" class="btn btn-primary " style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">Magazine Luiza</a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <th:block th:replace="fragments/JsFragment :: script"></th:block>
  </body>
</html>
