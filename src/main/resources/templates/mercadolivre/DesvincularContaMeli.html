<html lang="pt-BR">
  <head>
    <title>Desvincular conta Mercado Livre</title>
    <meta name="description" content="Desvincular conta Mercado Livre">
    <th:block th:replace="~{fragments/CssFragment :: css}"></th:block>
    <th:block th:replace="~{layout/fragments/Menu :: menu}"></th:block>
  </head>
  <body class="bg-light">
    <main class="container mb-4 py-5 bg-light d-flex justify-content-center">
      <div class="card" style="width: 18rem;">
        <h5 class="card-header">Desvincular conta</h5>
        <div class="card-body">
          <div class="d-flex justify-content-center">
            <img draggable="false" th:src="@{/imagens/mercado-livre-logo.png}" alt="Logo">
          </div>
          <p class="card-text text-muted fs-6">Você está preste a desvincular sua conta do Mercado livre desse sistema, para continuar clique no botão abaixo</p>
          <div class="d-flex justify-content-center mt-2">
            <button class="btn btn-warning text-primary" id="btnDescincularContaMeli" style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem; background-color: #fae634">Desvincular</button>
          </div>
        </div>
      </div>
    </main>
    <th:block th:replace="~{fragments/JsFragment :: script}"></th:block>
    <script type="text/javascript">
      $(function() {
        $("#btnDescincularContaMeli").click(function () {
          Swal.fire({
            title: 'Tem certeza?',
            text: '',
            showCancelButton: true,
            confirmButtonColor: '#DD6B55',
            confirmButtonText: 'Sim, desvincular agora!',
            cancelButtonText: "Cancelar"
          }).then((result) => {
            if (result.isConfirmed) {
              $.ajax({
                url: `${CONTEXT}mercado-livre/desvincular-conta-meli`,
                method: 'DELETE',
                success: function(response) {
                  Swal.fire({
                    title: "Atenção",
                    text: "Conta desvinculada com sucesso, a seguir você será redirecionado para a tela de login!",
                    icon: "success",
                    showCancelButton: false,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "OK"
                  }).then((result) => {
                    if (result.isConfirmed) {
                      $.get(`${CONTEXT}mercado-livre/login`, function (){
                        location.reload();
                      });
                    }
                  });
                },
                error: function(response) {
                  console.log(response);
                }
              });
            }
          });
        });
      });
    </script>
  </body>
</html>
